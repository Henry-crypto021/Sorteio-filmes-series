<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar - Sorteio de Filmes e Séries</title>
  <script src="{{ url_for('static', filename='tema.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "barra.html" %}
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <button type="button" class="tema-botao" id="tema-botao" aria-label="Alternar entre tema claro e escuro">
    <svg class="icone icone-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icone icone-lua" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="container">
    <h1 class="titulo">Buscar</h1>
    <p class="subtitulo">Procure um filme ou série pelo nome.</p>

    <form action="/buscar" method="get" class="busca">
      <input type="search" name="q" value="{{ q }}" placeholder="Nome do filme ou série" maxlength="100" required aria-label="Buscar filme ou série pelo nome">
      <button type="submit">Buscar</button>
    </form>

    {% if q and not resultados %}
      <p>Não encontrei nada para "{{ q }}".</p>
    {% endif %}

    <div class="grade-busca">
      {% for r in resultados %}
        <a href="/titulo/{{ r.tipo }}/{{ r.id }}">
          <img src="https://image.tmdb.org/t/p/w342{{ r.poster }}" alt="{{ r.titulo }}" loading="lazy">
          <span>{{ r.titulo }}{% if r.ano %} ({{ r.ano }}){% endif %}</span>
        </a>
      {% endfor %}
    </div>
  </div>
</body>
</html>
