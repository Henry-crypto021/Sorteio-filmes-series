<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteio de Filmes e Séries</title>
  <script src="{{ url_for('static', filename='tema.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <button type="button" class="tema-botao" id="tema-botao" aria-label="Alternar entre tema claro e escuro">
    <svg class="icone icone-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icone icone-lua" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="container">
    <h1 class="titulo">Sorteio de Filmes e Séries</h1>
    <p class="subtitulo">Escolha o que quiser e deixe a sorte decidir.</p>

    <form method="post" action="/resultado">
      <h2>O que você quer assistir?</h2>
      <div class="opcoes">
        <label>
          <input type="radio" name="tipo" value="filme" checked>
          <svg class="icone" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          Filme
        </label>
        <label>
          <input type="radio" name="tipo" value="serie">
          <svg class="icone" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
          Série
        </label>
      </div>

      <h2>Gêneros</h2>
      <div class="opcoes" id="generos">
        <label data-tipos="filme,serie">
          <input type="checkbox" name="generos" value="acao">
          <svg class="icone" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Ação
        </label>
        <label data-tipos="filme,serie">
          <input type="checkbox" name="generos" value="comedia">
          <svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          Comédia
        </label>
        <label data-tipos="filme,serie">
          <input type="checkbox" name="generos" value="drama">
          <svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          Drama
        </label>
        <label data-tipos="filme">
          <input type="checkbox" name="generos" value="terror">
          <svg class="icone" viewBox="0 0 24 24"><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>
          Terror
        </label>
        <label data-tipos="filme,serie">
          <input type="checkbox" name="generos" value="ficcao">
          <svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-25 12 12)"/></svg>
          Ficção científica
        </label>
        <label data-tipos="filme,serie">
          <input type="checkbox" name="generos" value="animacao">
          <svg class="icone" viewBox="0 0 24 24"><circle cx="7" cy="7" r="4"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M7 14l4 7H3z"/></svg>
          Animação
        </label>
        <label data-tipos="filme">
          <input type="checkbox" name="generos" value="romance">
          <svg class="icone" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Romance
        </label>
        <label data-tipos="filme,serie">
          <input type="checkbox" name="generos" value="documentario">
          <svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Documentário
        </label>
        <label data-tipos="serie">
          <input type="checkbox" name="generos" value="dorama">
          <svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><circle cx="17" cy="12" r="3"/><circle cx="12" cy="17" r="3"/><circle cx="7" cy="12" r="3"/><circle cx="12" cy="12" r="1.5"/></svg>
          Doramas
        </label>
        <label data-tipos="serie">
          <input type="checkbox" name="generos" value="novela">
          <svg class="icone" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          Novela
        </label>
      </div>

      <h2>Plataformas</h2>
      <div class="opcoes plataformas">
        <label style="--cor:#e50914"><input type="checkbox" name="plataformas" value="8"> Netflix</label>
        <label style="--cor:#00a8e1"><input type="checkbox" name="plataformas" value="119"> Prime Video</label>
        <label style="--cor:#113ccf"><input type="checkbox" name="plataformas" value="337"> Disney+</label>
        <label style="--cor:var(--apple); --cor-texto:var(--apple-texto)"><input type="checkbox" name="plataformas" value="350"> Apple TV+</label>
        <label style="--cor:#5822b4"><input type="checkbox" name="plataformas" value="hbomax"> HBO Max</label>
        <label style="--cor:#0064ff"><input type="checkbox" name="plataformas" value="531"> Paramount+</label>
        <label style="--cor:#f47521"><input type="checkbox" name="plataformas" value="283"> Crunchyroll</label>
        <label style="--cor:#ff5a1f"><input type="checkbox" name="plataformas" value="globoplay"> Globoplay</label>
      </div>

      <h2>Época</h2>
      <div class="epoca">
        <div class="opcoes" id="epocas">
          <label><input type="radio" name="epoca" value="" checked> Qualquer época</label>
          <label><input type="radio" name="epoca" value="2020-"> 2020 em diante</label>
          <label><input type="radio" name="epoca" value="2010-2019"> Anos 2010</label>
          <label><input type="radio" name="epoca" value="2000-2009"> Anos 2000</label>
          <label><input type="radio" name="epoca" value="1990-1999"> Anos 90</label>
          <label><input type="radio" name="epoca" value="1980-1989"> Anos 80</label>
          <label><input type="radio" name="epoca" value="-1979"> Clássicos</label>
          <label><input type="radio" name="epoca" value="personalizado"> Escolher anos</label>
        </div>

        <div class="faixa" id="faixa" hidden>
          <div class="faixa-rotulo" id="rotulo"></div>
          <div class="slider">
            <div class="trilho"><div class="preenchido" id="preenchido"></div></div>
            <input type="range" id="slider-de" step="1" aria-label="Ano inicial">
            <input type="range" id="slider-ate" step="1" aria-label="Ano final">
          </div>
          <div class="faixa-limites"><span id="minimo"></span><span id="maximo"></span></div>
        </div>

        <input type="hidden" name="ano_de" id="ano_de">
        <input type="hidden" name="ano_ate" id="ano_ate">
      </div>

      <button type="submit" class="botao-principal">
        <svg class="icone" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        Sortear
      </button>
    </form>
    <div class="credito">
      <img src="{{ url_for('static', filename='tmdb.svg') }}" alt="TMDB" class="logo-tmdb">
      <p>This product uses the TMDB API but is not endorsed or certified by TMDB.<br>
      Streaming availability data provided by JustWatch.</p>
  </div>

  <script>
    // ----- Filme ou série: mostra só os gêneros que existem para cada um -----
    const opcoesTipo = document.querySelectorAll('input[name="tipo"]');
    const labelsGeneros = document.querySelectorAll('#generos label');

    function atualizarGeneros() {
      const tipo = document.querySelector('input[name="tipo"]:checked').value;

      labelsGeneros.forEach(function (label) {
        const visivel = label.dataset.tipos.split(",").includes(tipo);
        label.style.display = visivel ? "" : "none";
        if (!visivel) {
          label.querySelector("input").checked = false;
        }
      });
    }

    opcoesTipo.forEach(function (opcao) {
      opcao.addEventListener("change", atualizarGeneros);
    });
    atualizarGeneros();

    // ----- Época: atalhos + controle deslizante -----
    const radiosEpoca = document.querySelectorAll('input[name="epoca"]');
    const faixa = document.getElementById("faixa");
    const campoDe = document.getElementById("ano_de");
    const campoAte = document.getElementById("ano_ate");
    const sliderDe = document.getElementById("slider-de");
    const sliderAte = document.getElementById("slider-ate");
    const rotulo = document.getElementById("rotulo");
    const preenchido = document.getElementById("preenchido");

    const anoMinimo = 1950;
    const anoAtual = new Date().getFullYear();

    sliderDe.min = sliderAte.min = anoMinimo;
    sliderDe.max = sliderAte.max = anoAtual;
    sliderDe.value = 2000;
    sliderAte.value = anoAtual;
    document.getElementById("minimo").textContent = anoMinimo;
    document.getElementById("maximo").textContent = anoAtual;

    function ajustarSliders(origem) {
      let de = Number(sliderDe.value);
      let ate = Number(sliderAte.value);

      // Um botão não pode passar do outro
      if (de > ate) {
        if (origem === sliderDe) {
          de = ate;
          sliderDe.value = de;
        } else {
          ate = de;
          sliderAte.value = ate;
        }
      }

      rotulo.textContent = de === ate ? de : de + " — " + ate;

      const total = anoAtual - anoMinimo;
      preenchido.style.left = ((de - anoMinimo) / total * 100) + "%";
      preenchido.style.right = (100 - (ate - anoMinimo) / total * 100) + "%";

      campoDe.value = de;
      campoAte.value = ate;
    }

    function atualizarEpoca() {
      const escolhida = document.querySelector('input[name="epoca"]:checked').value;
      faixa.hidden = escolhida !== "personalizado";

      if (escolhida === "personalizado") {
        ajustarSliders(null);
      } else {
        // Exemplos: "2010-2019", "2020-" (de 2020 em diante), "-1979" (até 1979), "" (qualquer)
        const partes = escolhida.split("-");
        campoDe.value = partes[0] || "";
        campoAte.value = partes[1] || "";
      }
    }

    radiosEpoca.forEach(function (radio) {
      radio.addEventListener("change", atualizarEpoca);
    });
    sliderDe.addEventListener("input", function () { ajustarSliders(sliderDe); });
    sliderAte.addEventListener("input", function () { ajustarSliders(sliderAte); });

    atualizarEpoca();
  </script>
</body>
</html>
